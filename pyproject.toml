[project]
name = "azdo-metrics"
version = "0.1.0"
description = "Fetch Azure DevOps sprint metrics, store them locally (DuckDB) and export them to VictoriaMetrics for Perses dashboards"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "typer>=0.12",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
metrics = "metrics.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Typer requires calling typer.Option()/typer.Argument() in argument defaults.
ignore = ["B008"]
