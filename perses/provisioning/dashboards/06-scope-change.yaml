kind: Dashboard
metadata:
  name: scope-change
  project: azdo-metrics
spec:
  display:
    name: "Scope Change"
  duration: 1y
  variables:
    - kind: ListVariable
      spec:
        name: sprint
        display:
          name: Sprint
        allowMultiple: true
        allowAllValue: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: sprint
            # Deliberately not azdo_sprint_scope_change_rate: that metric is
            # skipped for sprints without items, which would hide them here.
            matchers:
              - azdo_sprint_scope_items{}
    - kind: ListVariable
      spec:
        name: work_item_type
        display:
          name: Work Item Type
        allowMultiple: true
        allowAllValue: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: work_item_type
            matchers:
              - azdo_sprint_scope_items{}
  panels:
    note:
      kind: Panel
      spec:
        display:
          name: "Reading this dashboard"
        plugin:
          kind: Markdown
          spec:
            text: >-
              "Added mid-sprint" counts items whose **first** appearance in a
              sprint came after day one — i.e. work pulled onto the board
              after planning, rather than committed upfront. Scope change
              rate = added mid-sprint / final scope. The trend line plots one
              point per sprint at its end date; green/yellow/red bands mark
              healthy (<10%), elevated (10–25%) and high (>25%) churn.
    scope_change_rate:
      kind: Panel
      spec:
        display:
          name: "Scope Change Rate — Trend"
          description: >-
            Share of final scope that was added after day one, one point per
            sprint at its end date.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
            yAxis:
              format: { unit: percent-decimal }
            visual:
              showPoints: "always"
              pointRadius: 4
              connectNulls: true
            thresholds:
              mode: absolute
              defaultColor: "#28a745"
              steps:
                - value: 0.10
                  color: "#f0ad4e"
                  name: elevated
                - value: 0.25
                  color: "#d9534f"
                  name: high
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  seriesNameFormat: "{{work_item_type}} — scope change rate"
                  query: >-
                    max by (work_item_type)
                    (azdo_sprint_scope_change_rate{sprint=~"$sprint", work_item_type=~"$work_item_type"})
    planned_vs_added:
      kind: Panel
      spec:
        display:
          name: "Planned (Day 1) vs. Added Mid-Sprint"
        plugin:
          kind: BarChart
          spec:
            calculation: last
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  seriesNameFormat: "{{sprint}} / {{work_item_type}} — planned"
                  query: >-
                    azdo_sprint_planned_items{sprint=~"$sprint", work_item_type=~"$work_item_type"}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  seriesNameFormat: "{{sprint}} / {{work_item_type}} — added mid-sprint"
                  query: >-
                    azdo_sprint_added_mid_sprint_items{sprint=~"$sprint", work_item_type=~"$work_item_type"}
    completion_rate:
      kind: Panel
      spec:
        display:
          name: "Completion Rate — Trend"
          description: >-
            Completed items / final scope, one point per sprint at its end
            date.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
            yAxis:
              format: { unit: percent-decimal }
            visual:
              showPoints: "always"
              pointRadius: 4
              connectNulls: true
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  seriesNameFormat: "{{work_item_type}} — completion rate"
                  query: >-
                    max by (work_item_type)
                    (azdo_sprint_completion_rate{sprint=~"$sprint", work_item_type=~"$work_item_type"})
  layouts:
    - kind: Grid
      spec:
        items:
          - x: 0
            y: 0
            width: 24
            height: 3
            content: { $ref: "#/spec/panels/note" }
          - x: 0
            y: 3
            width: 24
            height: 9
            content: { $ref: "#/spec/panels/scope_change_rate" }
          - x: 0
            y: 12
            width: 12
            height: 9
            content: { $ref: "#/spec/panels/planned_vs_added" }
          - x: 12
            y: 12
            width: 12
            height: 9
            content: { $ref: "#/spec/panels/completion_rate" }
