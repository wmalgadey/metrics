kind: Dashboard
metadata:
  name: cycle-time
  project: azdo-metrics
spec:
  display:
    name: "Cycle Time"
  duration: 1y
  variables:
    - kind: ListVariable
      spec:
        name: sprint
        display:
          name: Sprint
        allowMultiple: true
        allowAllValue: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: sprint
            # Deliberately not azdo_cycle_time_days: that metric only exists
            # for sprints with completed items, which would hide sprints here.
            matchers:
              - azdo_sprint_scope_items{}
    - kind: ListVariable
      spec:
        name: work_item_type
        display:
          name: Work Item Type
        allowMultiple: true
        allowAllValue: true
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: work_item_type
            matchers:
              - azdo_sprint_scope_items{}
  panels:
    cycle_time:
      kind: Panel
      spec:
        display:
          name: "Cycle Time — P50 / P85 / P95 (days)"
          description: >-
            Perses has no native box plot, so percentiles are shown as
            separate series per work item type. Cycle time = first entering
            an "in progress" state to reaching "done" (config.yaml
            metrics.states). One point per sprint, plotted at the sprint's
            end date.
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
            visual:
              showPoints: "always"
              pointRadius: 4
              connectNulls: true
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  seriesNameFormat: "{{work_item_type}} — P{{quantile}}"
                  query: >-
                    max by (work_item_type, quantile)
                    (azdo_cycle_time_days{sprint=~"$sprint", work_item_type=~"$work_item_type"})
    lead_time:
      kind: Panel
      spec:
        display:
          name: "Lead Time — P50 / P85 / P95 (days)"
          description: "Lead time = created to done. One point per sprint, plotted at the sprint's end date."
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
            visual:
              showPoints: "always"
              pointRadius: 4
              connectNulls: true
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  seriesNameFormat: "{{work_item_type}} — P{{quantile}}"
                  query: >-
                    max by (work_item_type, quantile)
                    (azdo_lead_time_days{sprint=~"$sprint", work_item_type=~"$work_item_type"})
  layouts:
    - kind: Grid
      spec:
        items:
          - x: 0
            y: 0
            width: 24
            height: 9
            content: { $ref: "#/spec/panels/cycle_time" }
          - x: 0
            y: 9
            width: 24
            height: 9
            content: { $ref: "#/spec/panels/lead_time" }
